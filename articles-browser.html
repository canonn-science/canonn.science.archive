<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canonn Articles Browser</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a21;
    --border: #2a2f3a;
    --text: #e4e7ec;
    --muted: #8b93a1;
    --accent: #5b9dff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
  #app { display: flex; height: 100vh; }
  #sidebar { width: 380px; min-width: 260px; max-width: 50vw; border-right: 1px solid var(--border); display: flex; flex-direction: column; background: var(--panel); }
  #sidebar-header { padding: 12px; border-bottom: 1px solid var(--border); }
  #sidebar-header h1 { font-size: 15px; margin: 0 0 8px; color: var(--text); }
  #search { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); background: #0d0f14; color: var(--text); font-size: 13px; }
  #count { font-size: 12px; color: var(--muted); margin-top: 6px; }
  #list { flex: 1; overflow-y: auto; }
  #pager { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--border); }
  #pager button { background: #0d0f14; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
  #pager button:hover:not(:disabled) { background: #1c212b; }
  #pager button:disabled { opacity: 0.4; cursor: default; }
  #pager .pageinfo { font-size: 12px; color: var(--muted); }
  .item { padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .item:hover { background: #1c212b; }
  .item.active { background: #1f2a3d; border-left: 3px solid var(--accent); }
  .item .t { font-size: 13.5px; font-weight: 600; line-height: 1.3; margin-bottom: 4px; }
  .item .d { font-size: 11.5px; color: var(--muted); }
  #resizer { width: 5px; cursor: col-resize; background: transparent; }
  #resizer:hover { background: var(--accent); }
  #main { flex: 1; overflow-y: auto; padding: 32px 48px; }
  #main .placeholder { color: var(--muted); font-size: 14px; margin-top: 40px; text-align: center; }
  #article h1 { font-size: 26px; margin: 0 0 6px; }
  #article .meta { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  #article .meta a { color: var(--accent); text-decoration: none; }
  #article .body { max-width: 760px; line-height: 1.6; font-size: 15.5px; }
  #article .body img { max-width: 100%; border-radius: 4px; }
  #article .body blockquote { border-left: 3px solid var(--border); margin: 12px 0; padding: 4px 16px; color: #c7cbd3; background: #161a21; }
  #article .body a { color: var(--accent); }
  #article .body hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: #2a2f3a; border-radius: 5px; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>Canonn Articles</h1>
      <input id="search" type="text" placeholder="Search title or content...">
      <div id="count"></div>
    </div>
    <div id="list"></div>
    <div id="pager">
      <button id="prevPage">Prev</button>
      <span class="pageinfo" id="pageinfo"></span>
      <button id="nextPage">Next</button>
    </div>
  </div>
  <div id="resizer"></div>
  <div id="main">
    <div class="placeholder" id="placeholder">Select an article from the list to read it here.</div>
    <div id="article" style="display:none"></div>
  </div>
</div>
<script>

const listEl = document.getElementById('list');
const searchEl = document.getElementById('search');
const countEl = document.getElementById('count');
const articleEl = document.getElementById('article');
const placeholderEl = document.getElementById('placeholder');
const pageinfoEl = document.getElementById('pageinfo');
const prevPageEl = document.getElementById('prevPage');
const nextPageEl = document.getElementById('nextPage');

const PAGE_SIZE = 20;
let DATA = [];
let activeId = null;
let currentPage = 0;
let currentFiltered = [];

function fmtDate(d) {
  try { return new Date(d).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }); }
  catch (e) { return d; }
}

function normalize(raw) {
  return raw.map(p => ({
    id: p.id,
    title: (p.title && p.title.rendered) || '',
    date: p.date,
    link: p.link,
    content: (p.content && p.content.rendered) || ''
  }));
}

function render(filterText) {
  const q = (filterText || '').trim().toLowerCase();
  currentFiltered = q
    ? DATA.filter(a => a.title.toLowerCase().includes(q) || a.content.toLowerCase().includes(q))
    : DATA;
  currentPage = 0;
  renderPage();
}

function renderPage() {
  const filtered = currentFiltered;
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  currentPage = Math.min(Math.max(currentPage, 0), totalPages - 1);
  const start = currentPage * PAGE_SIZE;
  const pageItems = filtered.slice(start, start + PAGE_SIZE);

  countEl.textContent = filtered.length + ' of ' + DATA.length + ' articles';
  pageinfoEl.textContent = 'Page ' + (currentPage + 1) + ' of ' + totalPages;
  prevPageEl.disabled = currentPage <= 0;
  nextPageEl.disabled = currentPage >= totalPages - 1;

  listEl.innerHTML = '';
  const frag = document.createDocumentFragment();
  for (const a of pageItems) {
    const div = document.createElement('div');
    div.className = 'item' + (a.id === activeId ? ' active' : '');
    div.dataset.id = a.id;
    div.innerHTML = '<div class="t"></div><div class="d"></div>';
    div.querySelector('.t').textContent = a.title;
    div.querySelector('.d').textContent = fmtDate(a.date);
    div.addEventListener('click', () => openArticle(a.id));
    frag.appendChild(div);
  }
  listEl.appendChild(frag);
}

prevPageEl.addEventListener('click', () => { currentPage--; renderPage(); });
nextPageEl.addEventListener('click', () => { currentPage++; renderPage(); });

function openArticle(id) {
  const a = DATA.find(x => x.id === id);
  if (!a) return;
  activeId = id;
  placeholderEl.style.display = 'none';
  articleEl.style.display = 'block';
  articleEl.innerHTML =
    '<h1></h1>' +
    '<div class="meta"></div>' +
    '<div class="body"></div>';
  articleEl.querySelector('h1').textContent = a.title;
  const meta = articleEl.querySelector('.meta');
  meta.innerHTML = fmtDate(a.date) + ' &middot; <a href="' + a.link + '" target="_blank" rel="noopener">' + a.link + '</a>';
  articleEl.querySelector('.body').innerHTML = a.content;
  document.querySelectorAll('.item').forEach(el => {
    el.classList.toggle('active', Number(el.dataset.id) === id);
  });
  document.getElementById('main').scrollTop = 0;
}

searchEl.addEventListener('input', () => render(searchEl.value));

// Resizable sidebar
(function () {
  const sidebar = document.getElementById('sidebar');
  const resizer = document.getElementById('resizer');
  let dragging = false;
  resizer.addEventListener('mousedown', () => { dragging = true; document.body.style.userSelect = 'none'; });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const w = Math.min(Math.max(e.clientX, 260), window.innerWidth * 0.5);
    sidebar.style.width = w + 'px';
  });
  window.addEventListener('mouseup', () => { dragging = false; document.body.style.userSelect = ''; });
})();

countEl.textContent = 'Loading articles…';
listEl.innerHTML = '<div style="padding:12px;color:var(--muted);font-size:13px;">Loading articles…</div>';

fetch('articles.json')
  .then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(raw => {
    DATA = normalize(raw).sort((a, b) => new Date(b.date) - new Date(a.date));
    render('');
  })
  .catch(err => {
    countEl.textContent = 'Failed to load articles.json';
    listEl.innerHTML = '<div style="padding:12px;color:#ff8080;font-size:13px;">Could not load articles.json: ' + err.message + '<br>Serve this folder over HTTP (e.g. <code>python -m http.server</code>) rather than opening the file directly.</div>';
  });

</script>
</body>
</html>
